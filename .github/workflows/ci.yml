name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  NX_CI_EXECUTION: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
            nx-${{ runner.os }}-

      - run: npx nx run-many --target=lint --projects=@shiron/beatdash-web,@shiron/mutils-web

      - run: npx nx run-many --target=build --projects=@shiron/beatdash-web,@shiron/mutils-web

  dotnet:
    name: .NET ${{ matrix.cmd }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cmd: [build]
        include:
          - os: ubuntu-latest
            cmd: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build .NET (solution)
        if: matrix.cmd == 'build'
        run: dotnet build Shiron.slnx

      - name: Test .NET
        if: matrix.cmd == 'test'
        run: dotnet test backend/tests/Mutils.Tests/Shiron.Mutils.Tests.csproj

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - run: pnpm install --frozen-lockfile

      - run: npx nx run-many --target=lint --projects=@shiron/beatdash-web,@shiron/mutils-web

      - run: npx nx run-many --target=build --projects=@shiron/beatdash-web,@shiron/mutils-web

  dotnet:
    name: .NET ${{ matrix.cmd }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cmd: [build]
        include:
          - os: ubuntu-latest
            cmd: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build .NET (all projects)
        if: matrix.cmd == 'build' && runner.os == 'Windows'
        run: dotnet build Shiron.slnx

      - name: Build .NET (cross-platform)
        if: matrix.cmd == 'build' && runner.os != 'Windows'
        run: |
          dotnet build backend/src/Mutils.Api/Shiron.Mutils.Api.csproj
          dotnet build backend/src/BeatDash.API/Shiron.BeatDash.API.csproj

      - name: Test .NET
        if: matrix.cmd == 'test'
        run: dotnet test backend/tests/Mutils.Tests/Shiron.Mutils.Tests.csproj
